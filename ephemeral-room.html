<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ephemeral Room</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#040308">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ephemeral">
<style>
/* =====================================================================
   EPHEMERAL ROOM — a PIN-gated, zero-storage, self-destructing chat.

   WHAT "ZERO STORAGE" MEANS HERE, HONESTLY:
   - Nothing is ever written to localStorage, sessionStorage, cookies,
     or IndexedDB. Search this file — there is none of that.
   - Messages live only in the `messages` array in memory (RAM), and
     each one deletes itself after a countdown.
   - Closing this tab, or tapping "Leave Room", wipes everything
     instantly and irreversibly — there is nothing left to recover.

   HOW IT CONNECTS:
   - This talks to a small WebSocket relay server (see server.js) that
     holds rooms and messages ONLY in its own memory — never a
     database, never a file. The server forgets a message the instant
     it's relayed, and forgets a room the instant the last person
     leaves it.
   - The server's address is the SERVER_URL constant near the top of
     the script section below — already pointed at this app's own
     deployed server, so nobody has to type it in. Change that one
     line if the server ever moves to a different address.
   ===================================================================== */

:root{
--bg-deep:#05060a;
--bg-panel:#0b0e16;
--neon-cyan:#00f0ff;
--neon-magenta:#ff2ec4;
--neon-violet:#8b5cf6;
--text-main:#e8f4ff;
--text-dim:#7c8aa0;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}

html,body{
height:100%;
background:
radial-gradient(circle at 20% 10%, rgba(139,92,246,.12), transparent 40%),
radial-gradient(circle at 85% 80%, rgba(0,240,255,.10), transparent 45%),
var(--bg-deep);
color:var(--text-main);
overflow:hidden;
}

#app{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.hidden{display:none !important;}

/* ---- Join screen ---- */

.joinCard{
width:100%;
max-width:380px;
background:rgba(12,16,26,.85);
border:1px solid rgba(0,240,255,.25);
border-radius:18px;
padding:32px 26px;
box-shadow:0 0 40px rgba(0,240,255,.08), inset 0 0 60px rgba(139,92,246,.05);
backdrop-filter:blur(10px);
}

.joinCard h1{
font-size:1.5rem;
letter-spacing:1px;
background:linear-gradient(90deg,var(--neon-cyan),var(--neon-magenta));
-webkit-background-clip:text;
background-clip:text;
color:transparent;
margin-bottom:6px;
}

.joinCard .tagline{
color:var(--text-dim);
font-size:.82rem;
margin-bottom:24px;
line-height:1.5;
}

.field{
margin-bottom:16px;
}

.field label{
display:block;
font-size:.72rem;
text-transform:uppercase;
letter-spacing:1px;
color:var(--text-dim);
margin-bottom:6px;
}

.field input, .field select{
width:100%;
padding:13px 14px;
background:rgba(255,255,255,.04);
border:1px solid rgba(0,240,255,.2);
border-radius:10px;
color:var(--text-main);
font-size:15px;
outline:none;
transition:border-color .2s, box-shadow .2s;
}

.field input:focus{
border-color:var(--neon-cyan);
box-shadow:0 0 0 3px rgba(0,240,255,.12);
}

.ttlRow{
display:flex;
gap:8px;
margin-bottom:22px;
}

.ttlOption{
flex:1;
text-align:center;
padding:10px 4px;
border-radius:8px;
border:1px solid rgba(255,255,255,.12);
font-size:.78rem;
cursor:pointer;
color:var(--text-dim);
transition:.15s;
}

.ttlOption.active{
border-color:var(--neon-cyan);
color:var(--neon-cyan);
background:rgba(0,240,255,.08);
}

.joinBtn{
width:100%;
padding:14px;
border:none;
border-radius:10px;
font-weight:bold;
font-size:15px;
letter-spacing:.5px;
color:#04060a;
background:linear-gradient(90deg,var(--neon-cyan),var(--neon-violet));
cursor:pointer;
box-shadow:0 0 20px rgba(0,240,255,.3);
}

.joinBtn:active{transform:scale(.98);}

.joinError{
color:var(--neon-magenta);
font-size:.8rem;
margin-top:10px;
min-height:1em;
}

/* ---- Chat screen ---- */

#chatScreen{
width:100%;
max-width:460px;
height:100%;
max-height:760px;
display:flex;
flex-direction:column;
background:rgba(10,13,20,.9);
border:1px solid rgba(0,240,255,.2);
border-radius:18px;
overflow:hidden;
box-shadow:0 0 50px rgba(0,240,255,.08);
}

#chatHeader{
display:flex;
align-items:center;
justify-content:space-between;
padding:16px 18px;
border-bottom:1px solid rgba(255,255,255,.08);
background:rgba(255,255,255,.02);
}

#chatHeader .roomInfo .roomLabel{
font-size:.68rem;
color:var(--text-dim);
text-transform:uppercase;
letter-spacing:1px;
}

#chatHeader .roomInfo .roomPin{
font-size:1.05rem;
font-weight:bold;
color:var(--neon-cyan);
letter-spacing:1px;
}

#presenceDot{
display:inline-block;
width:8px;height:8px;
border-radius:50%;
background:#4ade80;
box-shadow:0 0 8px #4ade80;
margin-right:6px;
}

#memberCount{
font-size:.75rem;
color:var(--text-dim);
}

#leaveBtn{
padding:8px 14px;
border-radius:8px;
border:1px solid rgba(255,46,196,.4);
background:rgba(255,46,196,.08);
color:var(--neon-magenta);
font-size:.78rem;
cursor:pointer;
}

#messages{
flex:1;
overflow-y:auto;
padding:16px;
display:flex;
flex-direction:column;
gap:10px;
}

.msgRow{
display:flex;
flex-direction:column;
max-width:78%;
animation:msgIn .25s ease;
}

.msgRow.mine{align-self:flex-end;align-items:flex-end;}
.msgRow.theirs{align-self:flex-start;align-items:flex-start;}
.msgRow.system{align-self:center;max-width:100%;align-items:center;}

@keyframes msgIn{
from{opacity:0;transform:translateY(8px);}
to{opacity:1;transform:translateY(0);}
}

.msgSender{
font-size:.68rem;
color:var(--text-dim);
margin-bottom:3px;
padding:0 4px;
}

.msgBubble{
padding:10px 14px;
border-radius:14px;
font-size:14.5px;
line-height:1.4;
word-break:break-word;
position:relative;
}

.msgRow.mine .msgBubble{
background:linear-gradient(135deg,rgba(0,240,255,.18),rgba(139,92,246,.18));
border:1px solid rgba(0,240,255,.3);
border-bottom-right-radius:4px;
}

.msgRow.theirs .msgBubble{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.1);
border-bottom-left-radius:4px;
}

.msgRow.system .msgBubble{
background:transparent;
border:none;
color:var(--text-dim);
font-size:.75rem;
font-style:italic;
padding:4px;
}

.msgMeta{
display:flex;
align-items:center;
gap:6px;
margin-top:3px;
padding:0 4px;
}

.selfDestructBar{
width:50px;
height:3px;
background:rgba(255,255,255,.12);
border-radius:3px;
overflow:hidden;
}

.selfDestructFill{
height:100%;
background:linear-gradient(90deg,var(--neon-cyan),var(--neon-magenta));
width:100%;
transform-origin:left;
}

.msgTimer{
font-size:.64rem;
color:var(--text-dim);
}

#composer{
display:flex;
gap:8px;
padding:14px;
border-top:1px solid rgba(255,255,255,.08);
background:rgba(255,255,255,.02);
}

#msgInput{
flex:1;
padding:12px 14px;
border-radius:24px;
border:1px solid rgba(0,240,255,.2);
background:rgba(255,255,255,.04);
color:var(--text-main);
font-size:15px;
outline:none;
}

#msgInput:focus{border-color:var(--neon-cyan);}

#sendBtn{
width:46px;
height:46px;
border-radius:50%;
border:none;
background:linear-gradient(135deg,var(--neon-cyan),var(--neon-violet));
color:#04060a;
font-size:18px;
cursor:pointer;
flex-shrink:0;
}

#sendBtn:active{transform:scale(.95);}

#messages::-webkit-scrollbar{width:5px;}
#messages::-webkit-scrollbar-thumb{background:rgba(0,240,255,.25);border-radius:4px;}
</style>
</head>
<body>

<div id="app">

<!-- ---- Join / Create Room screen ---- -->
<div id="joinScreen" class="joinCard">
<h1>⚡ EPHEMERAL ROOM</h1>
<p class="tagline">Enter a PIN to join or create a room. Anyone with the same PIN lands in the same room. Nothing is ever saved — messages exist only while the room is open, and self-destruct on their own.</p>

<div class="field">
<label>Your Display Name</label>
<input id="nameInput" placeholder="e.g. Ghost" maxlength="20">
</div>

<div class="field">
<label>Room PIN</label>
<input id="pinInput" placeholder="4+ characters" maxlength="24">
</div>

<div class="field">
<label>Messages Self-Destruct After</label>
<div class="ttlRow">
<div class="ttlOption" data-ttl="10">10s</div>
<div class="ttlOption active" data-ttl="30">30s</div>
<div class="ttlOption" data-ttl="60">60s</div>
<div class="ttlOption" data-ttl="300">5m</div>
</div>
</div>

<button class="joinBtn" id="joinBtn">Enter Room</button>
<p class="joinError" id="joinError"></p>
</div>

<!-- ---- Chat screen ---- -->
<div id="chatScreen" class="hidden">

<div id="chatHeader">
<div class="roomInfo">
<div class="roomLabel">Room PIN</div>
<div class="roomPin" id="roomPinLabel"></div>
</div>
<div style="text-align:right;">
<div><span id="presenceDot"></span><span id="memberCount">1 here</span></div>
</div>
<button id="leaveBtn">🚪 Leave &amp; Purge</button>
</div>

<div id="messages"></div>

<div id="composer">
<input id="msgInput" placeholder="Type a message that won't last...">
<button id="sendBtn">➤</button>
</div>

</div>

</div>

<script>
// =====================================================================
// STATE — all of it lives only in memory. None of this is ever written
// to localStorage/sessionStorage/cookies/IndexedDB. Check for yourself:
// there's no such call anywhere in this file.
// =====================================================================

// This app's own permanent relay server — nobody has to type it in.
const SERVER_URL = "wss://ephemeral-room-server-14dj.onrender.com";

let roomPin = null;
let displayName = null;
let selfDestructSeconds = 30;
let clientId = Math.random().toString(36).slice(2, 10); // this tab's own id, memory-only
let messages = []; // { id, sender, text, isMine, createdAt, ttl }
let socket = null; // WebSocket connection to the relay server — nothing persisted client-side either

// ---- TTL picker ----

document.querySelectorAll(".ttlOption").forEach((el) => {
el.addEventListener("click", () => {
document.querySelectorAll(".ttlOption").forEach((o) => o.classList.remove("active"));
el.classList.add("active");
selfDestructSeconds = Number(el.dataset.ttl);
});
});

// ---- Joining a room ----

document.getElementById("joinBtn").addEventListener("click", joinRoom);
document.getElementById("pinInput").addEventListener("keyup", (e) => {
if(e.key === "Enter") joinRoom();
});

function joinRoom(){

const name = document.getElementById("nameInput").value.trim();
const pin = document.getElementById("pinInput").value.trim();
const errorEl = document.getElementById("joinError");

if(!name){
errorEl.innerText = "Pick a display name first.";
return;
}

if(!pin || pin.length < 4){
errorEl.innerText = "PIN needs to be at least 4 characters.";
return;
}

displayName = name;
roomPin = pin;
errorEl.innerText = "Connecting... (first connection after a quiet spell can take 10-20s to wake up)";

try{
socket = new WebSocket(SERVER_URL);
}catch(error){
errorEl.innerText = "Couldn't connect to the server — try again in a moment.";
return;
}

socket.onopen = () => {
errorEl.innerText = "";
socket.send(JSON.stringify({ type: "join", pin: roomPin, name: displayName }));
};

socket.onmessage = (event) => {
let data;
try{ data = JSON.parse(event.data); }catch(e){ return; }
handleIncoming(data);
};

socket.onerror = () => {
errorEl.innerText = "Connection error — is the server running and the address correct?";
};

socket.onclose = () => {
if(!document.getElementById("chatScreen").classList.contains("hidden")){
addSystemMessage("Disconnected from the server.");
}
};

window.addEventListener("beforeunload", purgeAndLeave);

}

// ---- Sending ----

document.getElementById("sendBtn").addEventListener("click", sendMessage);
document.getElementById("msgInput").addEventListener("keyup", (e) => {
if(e.key === "Enter") sendMessage();
});

function sendMessage(){

const input = document.getElementById("msgInput");
const text = input.value.trim();

if(!text || !socket || socket.readyState !== WebSocket.OPEN) return;

const msg = {
id: clientId + "-" + Date.now(),
sender: displayName,
text: text,
createdAt: Date.now(),
ttl: selfDestructSeconds
};

input.value = "";

renderMessage(msg, true);

// The server already knows which room this connection is in — we
// just send the text and TTL, it relays to everyone else in the room.
socket.send(JSON.stringify({ type: "message", text: text, ttl: selfDestructSeconds }));

}

// ---- Receiving (relayed by the server, from other people in the room) ----

function handleIncoming(data){

if(data.type === "joined"){
document.getElementById("joinScreen").classList.add("hidden");
document.getElementById("chatScreen").classList.remove("hidden");
document.getElementById("roomPinLabel").innerText = roomPin;
updateMemberCount(data.memberCount);
addSystemMessage("You joined the room. Messages self-destruct after " + selfDestructSeconds + "s.");
}

if(data.type === "error"){
document.getElementById("joinError").innerText = data.message;
}

if(data.type === "message"){
renderMessage({
id: "remote-" + Date.now() + "-" + Math.random(),
sender: data.sender,
text: data.text,
ttl: data.ttl
}, false);
}

if(data.type === "presence"){
updateMemberCount(data.memberCount);
if(data.event === "join"){
addSystemMessage((data.name || "Someone") + " joined the room.");
}
if(data.event === "leave"){
addSystemMessage((data.name || "Someone") + " left the room.");
}
}

}

function updateMemberCount(count){
const n = count || 1;
document.getElementById("memberCount").innerText = n + " here";
}

// ---- Rendering + self-destruct ----

function renderMessage(msg, isMine){

messages.push(msg);

const container = document.getElementById("messages");

const row = document.createElement("div");
row.className = "msgRow " + (isMine ? "mine" : "theirs");
row.id = "msg-" + msg.id;

const senderEl = document.createElement("div");
senderEl.className = "msgSender";
senderEl.innerText = isMine ? "You" : msg.sender;
row.appendChild(senderEl);

const bubble = document.createElement("div");
bubble.className = "msgBubble";
bubble.innerText = msg.text; // innerText only — never innerHTML, so nobody can inject a script via chat
row.appendChild(bubble);

const meta = document.createElement("div");
meta.className = "msgMeta";

const bar = document.createElement("div");
bar.className = "selfDestructBar";
const fill = document.createElement("div");
fill.className = "selfDestructFill";
fill.style.transition = "transform " + msg.ttl + "s linear";
bar.appendChild(fill);
meta.appendChild(bar);

const timerLabel = document.createElement("span");
timerLabel.className = "msgTimer";
timerLabel.innerText = msg.ttl + "s";
meta.appendChild(timerLabel);

row.appendChild(meta);
container.appendChild(row);
container.scrollTop = container.scrollHeight;

// Kick off the countdown visual on the next frame so the CSS
// transition actually animates from full to empty.
requestAnimationFrame(() => {
requestAnimationFrame(() => {
fill.style.transform = "scaleX(0)";
});
});

let remaining = msg.ttl;
const countdownInterval = setInterval(() => {
remaining--;
if(remaining >= 0) timerLabel.innerText = remaining + "s";
if(remaining <= 0) clearInterval(countdownInterval);
}, 1000);

// The actual self-destruct — removes it from the DOM AND from the
// in-memory array. After this, the message no longer exists anywhere.
setTimeout(() => {
clearInterval(countdownInterval);
row.style.transition = "opacity .4s, transform .4s";
row.style.opacity = "0";
row.style.transform = "scale(.9)";
setTimeout(() => {
row.remove();
messages = messages.filter((m) => m.id !== msg.id);
}, 400);
}, msg.ttl * 1000);

}

function addSystemMessage(text){

const container = document.getElementById("messages");
const row = document.createElement("div");
row.className = "msgRow system";
const bubble = document.createElement("div");
bubble.className = "msgBubble";
bubble.innerText = text;
row.appendChild(bubble);
container.appendChild(row);
container.scrollTop = container.scrollHeight;

}

// ---- Leaving: the "instant purge" ----

document.getElementById("leaveBtn").addEventListener("click", purgeAndLeave);

function purgeAndLeave(){

// Wipe every trace from this tab's memory.
messages = [];
document.getElementById("messages").innerHTML = "";

if(socket){
// Closing the socket triggers the server's own cleanup too — it
// removes us from the room there, and deletes the room entirely
// from its memory if we were the last one in it.
socket.close();
socket = null;
}

document.getElementById("chatScreen").classList.add("hidden");
document.getElementById("joinScreen").classList.remove("hidden");
document.getElementById("pinInput").value = "";
document.getElementById("joinError").innerText = "";

}

if("serviceWorker" in navigator){
window.addEventListener("load", () => {
navigator.serviceWorker.register("sw.js").catch((err) => {
console.log("Service worker registration failed:", err);
});
});
}
</script>
</body>
</html>
